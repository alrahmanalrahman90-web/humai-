@keyframes zoom{to{transform:scale(1.14) translateY(-1%)}}
#shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(40,10,30,.18),rgba(40,10,30,.05) 45%,rgba(40,10,30,.35))}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.p{position:absolute;top:-8%;opacity:0;animation:fall linear infinite;filter:drop-shadow(0 0 4px rgba(255,150,190,.6))}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.85}90%{opacity:.8}100%{transform:translate(var(--dx),112vh) rotate(var(--r));opacity:0}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;z-index:2}
.card{position:relative;width:100%;max-width:360px;border-radius:26px;padding:20px 20px 22px;
 background:linear-gradient(160deg,rgba(255,200,225,.26),rgba(255,255,255,.08) 55%,rgba(255,150,190,.16));
 -webkit-backdrop-filter:blur(7px) saturate(140%);backdrop-filter:blur(7px) saturate(140%);
 border:1.5px solid rgba(255,214,232,.85);box-shadow:0 10px 40px rgba(120,20,70,.35),inset 0 0 22px rgba(255,255,255,.14),0 0 22px rgba(255,160,200,.3)}
.card::before,.card::after{content:"";position:absolute;width:13px;height:13px;border:2px solid #fff;opacity:.95}
.card::before{top:11px;left:12px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.card::after{bottom:11px;right:12px;border-left:0;border-top:0;border-bottom-right-radius:6px}
.hide{opacity:0;transform:translateY(24px) scale(.96);pointer-events:none;position:absolute}
.show{animation:slideIn 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
/* intro */
#intro{text-align:center;padding:30px 22px 28px}
#intro .heart{font-size:54px;animation:beat 1.4s ease-in-out infinite;display:inline-block;filter:drop-shadow(0 0 12px rgba(255,100,150,.8))}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
#intro h1{font-family:'Pacifico',cursive;font-weight:400;font-size:27px;margin:10px 0 6px;text-shadow:0 2px 10px rgba(120,20,70,.5)}
#intro p{font-size:13px;opacity:.92;margin-bottom:20px;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.btn{font-family:inherit;font-weight:700;font-size:14px;color:#fff;cursor:pointer;border-radius:999px;padding:11px 22px;
 background:linear-gradient(135deg,rgba(255,120,170,.75),rgba(255,70,130,.65));border:1.5px solid rgba(255,225,238,.9);
 box-shadow:0 6px 18px rgba(200,40,100,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .2s}
.btn:active{transform:scale(.94)}
.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,150,200,.7)}70%{box-shadow:0 0 0 16px rgba(255,150,200,0)}100%{box-shadow:0 0 0 0 rgba(255,150,200,0)}}
/* message */
#msg{display:none}
.top{display:flex;justify-content:center;position:relative;margin-bottom:10px}
.av{width:78px;height:78px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.35);border:2px solid rgba(255,235,244,.95);box-shadow:0 0 16px rgba(255,150,200,.6);opacity:0;transform:scale(.4);transition:all .8s cubic-bezier(.3,1.6,.5,1)}
.av.on{opacity:1;transform:scale(1)}
.flag{position:absolute;right:-2px;top:-4px;font-size:15px;background:rgba(255,255,255,.9);border-radius:4px;padding:0 4px;animation:beat 2s infinite}
#body{max-height:44vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.6) transparent;padding:2px 6px 2px 0;font-size:14.5px;line-height:1.65;text-shadow:0 1px 8px rgba(70,10,40,.55)}
#body::-webkit-scrollbar{width:3px}#body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.6);border-radius:3px}
.ln{min-height:1.65em;white-space:pre-wrap;animation:fadeUp .5s both}
.ln.b{font-weight:700}.ln.i{font-style:italic}.ln.sp{height:.9em;min-height:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cur{display:inline-block;width:2px;height:1.05em;background:#fff;margin-left:2px;vertical-align:-2px;animation:blink .7s steps(2) infinite;box-shadow:0 0 6px #fff}
@keyframes blink{50%{opacity:0}}
#g2wrap{display:none;text-align:center;margin-top:8px}
#g2{width:96px;max-width:40%;filter:drop-shadow(0 4px 10px rgba(120,20,70,.45));animation:fadeUp .8s both}
#acts{display:flex;gap:10px;justify-content:center;margin-top:14px;opacity:0;transition:opacity .8s}
#acts.on{opacity:1}
#acts .btn{font-size:12.5px;padding:8px 16px}
#mus{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:5;width:38px;height:38px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:16px;padding:0}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div><div id="fx"></div>
<button class="btn" id="mus" aria-label="musik">🎵</button>
<audio id="aud" src="https://files.catbox.moe/tcbcwk.mp3" loop preload="auto"></audio>

<div id="stage">
  <div class="card show" id="intro">
    <div class="heart">🤍</div>
    <h1>Ada pesan buat kamu</h1>
    <p>Ketuk tombolnya ya, pelan-pelan dibaca 🫣</p>
    <button class="btn pulse" id="open">Buka Pesan 💌</button>
  </div>

  <div class="card" id="msg">
    <div class="top">
      <img class="av" id="g1" alt="" src="https://htmlku.com/0/panda/cilukba.gif">
      <span class="flag">💌</span>
    </div>
    <div id="body"></div>
    <div id="g2wrap"><img id="g2" alt="" src="about:blank"></div>
    <div id="acts"><button class="btn" id="again">Ulangi 🔁</button></div>
  </div>
</div>

<script>
const $=s=>document.getElementById(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// bunga & hati melayang
(function(){const E=['🌸','🤍','💗','🌷','✨','💕','🌺'],fx=$('fx');
for(let i=0;i<20;i++){const s=document.createElement('span');s.className='p';s.textContent=E[i%E.length];
s.style.left=Math.random()*100+'%';s.style.fontSize=(10+Math.random()*14)+'px';
s.style.setProperty('--dx',(Math.random()*120-60)+'px');s.style.setProperty('--r',(Math.random()*360-180)+'deg');
s.style.animationDuration=(12+Math.random()*14)+'s';s.style.animationDelay=(-Math.random()*20)+'s';fx.appendChild(s)}})();

// isi teks (tidak diubah)
const SCRIPT=[
 {t:'Pergi ke warung membeli jamu,'},
 {t:'Pulangnya mampir membeli tahu,'},
 {t:'Selamat hari Minggu buat kamu,'},
 {t:'Manusia kesayangan aku🫣🤍'},
 {sp:1,wait:700},
 {t:'── ᯓᡣ𐭩',wait:1000},
 {sp:1},
 {t:'Ada lagi nih!',cls:'b',wait:900,sec:1},
 {sp:1},
 {t:'Jalan-jalan melihat panda,'},
 {t:'Pulangnya melewati jembatan,'},
 {t:'Wallpaperku kosong nih,'},
 {t:'Boleh nggak aku minta PAP buat dijadiin wallpaper',g2:1,wait:900},
 {sp:1},
 {t:'HIHIHI',cls:'i',wait:600}
];
const body=$('body');let run=0;
const scroll=()=>body.scrollTo({top:body.scrollHeight,behavior:'smooth'});
async function play(){
  const my=++run;body.innerHTML='';$('acts').classList.remove('on');$('g2wrap').style.display='none';
  $('g1').classList.remove('on');await sleep(500);$('g1').classList.add('on');await sleep(1100);
  for(const L of SCRIPT){
    if(my!==run)return;
    if(L.sp){const d=document.createElement('div');d.className='ln sp';body.appendChild(d);await sleep(L.wait||350);continue}
    const d=document.createElement('div');d.className='ln '+(L.cls||'');body.appendChild(d);
    const tn=document.createTextNode('');const cur=document.createElement('span');cur.className='cur';
    d.append(tn,cur);
    if(L.g2){$('g2').src='https://htmlku.com/0/panda/panah.gif';$('g2wrap').style.display='block';}
    const chars=Array.from(L.t);
    for(const c of chars){
      if(my!==run)return;
      tn.nodeValue+=c;scroll();
      await sleep(c===','?330:c==='!'?280:38+Math.random()*45);
    }
    await sleep(120);cur.remove();
    if(L.g2)scroll();
    await sleep(L.wait||520);
  }
  if(my!==run)return;
  const c=document.createElement('span');c.className='cur';body.lastChild.appendChild(c);
  $('acts').classList.add('on');scroll();
}
$('open').onclick=()=>{
  const a=$('aud');a.currentTime=0;a.play().catch(()=>{});
  $('mus').style.display='flex';
  const i=$('intro');i.classList.remove('show');i.style.transition='all .7s';i.style.opacity=0;i.style.transform='translateY(-26px) scale(.95)';
  setTimeout(()=>{i.style.display='none';const m=$('msg');m.style.display='block';m.classList.add('show');play()},750);
};
$('mus').onclick=()=>{const a=$('aud');if(a.paused){a.play();$('mus').textContent='🎵'}else{a.pause();$('mus').textContent='🔇'}};
$('again').onclick=()=>play();
</script>
</body>
